<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PalletBox Leilões</title>
<meta name="description" content="Leilões de lotes e pallets para revenda — ShopBox.">
<link rel="icon" type="image/webp" href="https://voxnmfnyfubzvodylxos.supabase.co/storage/v1/object/public/lotes/brand/palletbox-mark.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F1F0EC; --surface:#FFFFFF; --surface-2:#F7F6F2; --surface-3:#ECEAE3;
  --ink:#1A1712; --ink-2:#5C564C; --ink-3:#8C857A;
  --line:#E3E0D7; --line-2:#D2CDC1;
  --brand:#FC3C01; --brand-deep:#D33000; --brand-soft:#FFE7DD;
  --gold:#E9A400; --gold-soft:#FBEFCF;
  --success:#177C46; --success-soft:#E1F0E7;
  --danger:#C20E22; --danger-soft:#F7DDE0; --info:#2455C0;
  --panel:#16120D; --panel-ink:#EDE6DB; --panel-line:#332A20;
  --shadow:0 1px 2px rgba(20,12,4,.04);
  --shadow-md:0 2px 8px rgba(20,12,4,.06),0 14px 30px rgba(20,12,4,.07);
  --shadow-lg:0 30px 70px rgba(20,12,4,.22);
  --radius:10px; --radius-sm:7px; --radius-lg:14px;
  --dsp:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --maxw:1200px;
  --logo:url("https://voxnmfnyfubzvodylxos.supabase.co/storage/v1/object/public/lotes/brand/palletbox-logo.webp");
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12100C; --surface:#1B1712; --surface-2:#211C16; --surface-3:#2A241C;
  --ink:#F2ECE1; --ink-2:#B8AF9F; --ink-3:#8A8171; --line:#2E281F; --line-2:#3A3227;
  --brand-soft:#3A1A0C; --gold-soft:#33280F; --success-soft:#122A1C; --danger-soft:#33141A;
}}
:root[data-theme="dark"]{
  --bg:#12100C; --surface:#1B1712; --surface-2:#211C16; --surface-3:#2A241C;
  --ink:#F2ECE1; --ink-2:#B8AF9F; --ink-3:#8A8171; --line:#2E281F; --line-2:#3A3227;
  --brand-soft:#3A1A0C; --gold-soft:#33280F; --success-soft:#122A1C; --danger-soft:#33141A;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--dsp);font-weight:800;letter-spacing:-.01em;margin:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
.mono{font-family:var(--mono)}
button{font-family:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--radius);padding:12px 18px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-deep)}
.btn-line{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}.btn-line:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--ink-2)}.btn-ghost:hover{color:var(--ink)}
.btn-sm{padding:8px 12px;font-size:13px}
.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-3);color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em}
.tag.brand{background:var(--brand-soft);color:var(--brand-deep)}
.tag.ok{background:var(--success-soft);color:var(--success)}
.tag.warn{background:var(--danger-soft);color:var(--danger)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0 0 5px}
input,select,textarea{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink)}
input:focus,select,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.field{margin-bottom:12px}
.err{color:var(--danger);font-size:12px;margin-top:4px}
.muted{color:var(--ink-3)}
/* header */
header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:18px;height:104px}
.brandlogo{width:196px;height:94px;background:var(--logo) left center/contain no-repeat;flex:none}
.mainmenu{display:flex;gap:4px;margin-left:8px}
.mainmenu a{padding:8px 12px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;color:var(--ink-2)}
.mainmenu a:hover,.mainmenu a.on{color:var(--brand);background:var(--brand-soft)}
.navspace{flex:1}
.iconbtn{width:40px;height:40px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.userchip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:13px}
.userchip .av{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px}
.burger{display:none;width:40px;height:40px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
@media(max-width:980px){.mainmenu{display:none}.burger{display:grid;place-items:center}.hidemob{display:none!important}.brandlogo{width:168px;height:78px}}
.msheet{position:fixed;inset:0;z-index:90;background:rgba(15,10,4,.5)}
.msheet[hidden]{display:none!important}
.msheet .panel{position:absolute;top:0;right:0;bottom:0;width:min(300px,86vw);background:var(--surface);padding:20px 16px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.msheet .panel a{padding:13px 12px;border-radius:8px;font-weight:600;color:var(--ink)}
.msheet .panel a:hover{background:var(--surface-2)}
.msheet .panel hr{border:none;border-top:1px solid var(--line);margin:10px 0;width:100%}
/* hero */
.hero{padding:46px 0 30px}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.03}
.hero h1 .hl{color:var(--brand)}
.hero p{max-width:540px;color:var(--ink-2);font-size:16px;margin:14px 0 22px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--dsp);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.herobtns{display:flex;gap:12px;flex-wrap:wrap}
/* section */
.sec{padding:8px 0 40px}
.sechead{margin-bottom:18px}
.sechead .k{font-family:var(--dsp);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.sechead .k::before{content:"";width:22px;height:2px;background:var(--brand)}
.sechead h2{font-size:clamp(22px,3vw,30px)}
.sechead p{color:var(--ink-2);margin:6px 0 0}
/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.search{flex:1;min-width:200px;position:relative}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip .n{background:rgba(0,0,0,.08);border-radius:999px;padding:0 7px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.25)}
/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:16px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.15s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.ph{position:relative;aspect-ratio:16/11;background:var(--surface-3);display:grid;place-items:center;color:var(--ink-3)}
.ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ph .noimg{text-align:center;font-size:12px}
.ph .noimg svg{width:34px;height:34px;opacity:.5;display:block;margin:0 auto 6px}
.badges{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px}
.lotnum{font-family:var(--mono);font-size:11px;font-weight:700;background:rgba(22,18,13,.82);color:#fff;padding:4px 8px;border-radius:6px}
.cbody{padding:14px 15px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.ccat{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.ctit{font-family:var(--dsp);font-weight:700;font-size:18px;line-height:1.15}
.cmeta{font-size:12.5px;color:var(--ink-2)}
.pricerow{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.pricerow .lbl{font-size:11.5px;color:var(--ink-3);font-weight:600}
.pricerow .val{font-family:var(--mono);font-weight:700}
.big{font-size:20px}
.timer{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.timer .cd{font-family:var(--mono);font-weight:700;color:var(--ink)}
.timer.urgent .cd{color:var(--danger)}
.closed{color:var(--ink-3);font-weight:600;font-size:12.5px}
/* lot detail */
.dt-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:26px;align-items:start;margin-top:14px}
@media(max-width:860px){.dt-grid{grid-template-columns:1fr}}
.gallery{aspect-ratio:16/11;border-radius:var(--radius-lg);background:var(--surface-3);display:grid;place-items:center;color:var(--ink-3);overflow:hidden;position:relative}
.gallery.has{cursor:zoom-in;background:#16120d}
.gallery .gbg{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;filter:blur(22px) brightness(.7);opacity:.75;pointer-events:none}
.gallery .gmain{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.gallery .gzoom{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;background:rgba(15,10,4,.72);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;pointer-events:none}
.gallery .gzoom svg{width:14px;height:14px}
.gallery .gcount{position:absolute;left:10px;bottom:10px;background:rgba(15,10,4,.72);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px;font-family:var(--mono)}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#16120d;font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:2}
.gnav.prev{left:10px}.gnav.next{right:10px}
.gnav:hover{background:#fff}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:0 0 auto;width:72px;height:56px;border-radius:8px;background:var(--surface-3);padding:0;border:2px solid transparent;overflow:hidden;cursor:pointer;opacity:.7}
.thumbs button.on{border-color:var(--brand);opacity:1}
.thumbs button:hover{opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:fixed;inset:0;z-index:200;background:#0b0906;display:flex;flex-direction:column;touch-action:pan-y}
.lbtop{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff;font-size:13px}
.lbtop .lbt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.lbtop .lbc{font-family:var(--mono);opacity:.85}
.lbtop a{color:#fff;opacity:.85;text-decoration:underline;font-size:12.5px}
.lbx{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer}
.lbstage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 8px 16px}
.lbstage img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .2s ease;cursor:zoom-in;user-select:none;-webkit-user-drag:none}
.lbstage img.z{transform:scale(2.2);cursor:zoom-out}
.lb .gnav{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;width:48px;height:48px;font-size:28px}
.lb .gnav:hover{background:rgba(255,255,255,.28)}
.lbhint{color:rgba(255,255,255,.55);font-size:12px;text-align:center;padding:0 0 12px}
.desc{white-space:pre-line;word-break:break-word}
.btn-del{color:var(--danger)!important}
.btn-del:hover{background:var(--danger-soft,rgba(200,30,30,.1))!important}
.btn-danger{background:var(--danger);color:#fff;border:0}
.btn-danger:disabled{opacity:.45;cursor:not-allowed}
.dellist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm);margin:10px 0}
.dellist div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.dellist div:last-child{border-bottom:0}
/* admin: lote ao vivo + relatório */
.lnk{background:none;border:0;padding:0;color:var(--brand);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.lnk:hover{text-decoration:underline}
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:22px;padding:0 7px;border-radius:999px;font:700 12px var(--mono);color:#fff}
.sc.alto{background:var(--success)}.sc.medio{background:var(--gold)}.sc.baixo{background:#E06A1B}.sc.risco{background:var(--danger)}
.lv-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:12px 0 16px}
@media(max-width:980px){.lv-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.lv-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lv-k{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;min-width:0}
.lv-k .l{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700}
.lv-k .v{font:700 18px var(--mono);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:start}
@media(max-width:980px){.lv-grid{grid-template-columns:1fr}}
.lv-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;min-width:0}
.lv-card h4{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);margin-right:6px;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(23,124,70,.5)}70%{box-shadow:0 0 0 8px rgba(23,124,70,0)}100%{box-shadow:0 0 0 0 rgba(23,124,70,0)}}
.feed{display:flex;flex-direction:column;max-height:560px;overflow:auto}
.feed .it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.feed .it:last-child{border-bottom:0}
.feed .it.top{background:var(--success-soft);border-radius:8px;padding:9px 8px}
.feed .val{font:700 15px var(--mono)}
.feed .meta{font-size:12px;color:var(--ink-3)}
.av{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font:700 12px var(--body);flex:0 0 auto}
.rank{width:100%;border-collapse:collapse;font-size:13px}
.rank th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.rank td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.rank tr.lead td{background:var(--success-soft)}
.rank td.mono,.rank td:nth-child(n+3){white-space:nowrap}
.res{white-space:nowrap}
.pr-ov{position:fixed;inset:0;z-index:150;background:rgba(15,10,4,.45);display:flex;justify-content:flex-end}
.pr{width:min(640px,100%);height:100%;background:var(--bg);overflow:auto;box-shadow:var(--shadow-lg);animation:prIn .18s ease-out}
@keyframes prIn{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.pr-h{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pr-b{padding:14px 16px 30px;display:flex;flex-direction:column;gap:12px}
.pr-id{display:flex;gap:12px;align-items:center}
.pr-id .av{width:52px;height:52px;font-size:18px}
.pr-id h2{margin:0;font-size:21px}
.pr-sc{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.pr-sc .big{font:800 44px var(--dsp);line-height:1}
.pr-bar{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.pr-bar i{display:block;height:100%}
.sinais{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
.sinais li{display:flex;justify-content:space-between;gap:10px}
.sinais .pos{color:var(--success);font-weight:700}.sinais .neg{color:var(--danger);font-weight:700}.sinais .neu{color:var(--ink-3);font-weight:700}
.pr-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:560px){.pr-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pr-dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.pr-dl dt{color:var(--ink-3)}.pr-dl dd{margin:0;font-weight:600;word-break:break-word}
.res{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase}
.res.venceu,.res.liderando{background:var(--success-soft);color:var(--success)}
.res.superado{background:var(--gold-soft);color:var(--gold)}
.res.perdeu{background:var(--surface-3);color:var(--ink-3)}
.admpanel{border:2px dashed var(--brand);background:var(--brand-soft)}
@media print{
  body.printing>*:not(#prDrawer){display:none!important}
  body.printing #prDrawer{position:static;background:none;display:block}
  body.printing .pr{width:auto;height:auto;overflow:visible;box-shadow:none;animation:none;background:#fff}
  body.printing .noprint{display:none!important}
}
.sheethead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.sheethead p{margin:2px 0 0;font-size:13px}
.sheetframe{margin-top:12px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;height:min(70vh,560px)}
.sheetframe iframe{width:100%;height:100%;border:0;display:block}
.bidbox{position:sticky;top:116px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-md)}
.bidbox .lbl{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.bidbox .price{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1}
.stepper{display:flex;gap:8px;margin:14px 0 8px}
.stepper button{width:44px;height:44px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);font-size:20px;color:var(--brand)}
.stepper input{text-align:center;font-family:var(--mono);font-weight:700;font-size:16px}
.quick{display:flex;gap:8px;margin-bottom:12px}
.quick button{flex:1}
.note{background:var(--info);background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-size:12.5px;padding:10px 12px;border-radius:var(--radius-sm);display:flex;gap:8px;margin-top:10px}

.spin{width:22px;height:22px;border:3px solid var(--line-2);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.fotoprev{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}

function lotFotos(l){return ((l&&l.fotos)||[]).map(function(f){return f&&(f.url||f);}).filter(function(u){return typeof u==="string"&&/^https:\/\//i.test(u);});}
function sheetUrls(u){
  if(!u)return null; u=String(u).trim();
  if(!/^https:\/\/[^\s<>"']+$/i.test(u))return null;
  var m=u.match(/^https:\/\/docs\.google\.com\/spreadsheets\/d\/(e\/)?([A-Za-z0-9_-]+)/);
  if(!m)return {open:u,embed:null};
  var gid=(u.match(/[#&?]gid=(\d+)/)||[])[1];
  var embed=m[1]?("https://docs.google.com/spreadsheets/d/e/"+m[2]+"/pubhtml?widget=true&headers=false"+(gid?"&gid="+gid:""))
               :("https://docs.google.com/spreadsheets/d/"+m[2]+"/preview"+(gid?"?gid="+gid:""));
  return {open:u,embed:embed};
}
function lotSheet(l){
  if(!l)return null;
  var s1=sheetUrls(l.planilha_url); if(s1)return s1;
  var m=String(l.descricao||"").match(/https:\/\/docs\.google\.com\/spreadsheets\/[^\s<>"']+/);
  return m?sheetUrls(m[0]):null;
}
function linkify(t){return esc(t).replace(/https?:\/\/[^\s<]+/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener noreferrer" style="color:var(--brand);word-break:break-all">'+u+'</a>';});}
function galSet(i){
  var fotos=lotFotos(S.curLot),n=fotos.length; if(!n)return;
  i=((i%n)+n)%n; S.galIdx=i;
  var g=document.querySelector(".gallery.has"); if(!g)return;
  var a=g.querySelector(".gmain"),b=g.querySelector(".gbg"),c=g.querySelector(".gcount");
  if(a)a.src=fotos[i]; if(b)b.src=fotos[i]; if(c)c.textContent=(i+1)+"/"+n;
  document.querySelectorAll("[data-thumb]").forEach(function(t){t.classList.toggle("on",+t.getAttribute("data-thumb")===i);});
}
function openLightbox(fotos,i,title){
  if(!fotos||!fotos.length)return;
  var old=document.getElementById("lbox"); if(old)old.remove();
  var n=fotos.length, cur=i||0;
  var m=document.createElement("div"); m.className="lb"; m.id="lbox"; m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true");
  m.innerHTML='<div class="lbtop"><span class="lbt"></span><span class="lbc"></span><a class="lbo" target="_blank" rel="noopener noreferrer">Abrir original</a><button class="lbx" aria-label="Fechar">×</button></div>'
    +'<div class="lbstage">'+(n>1?'<button class="gnav prev" aria-label="Foto anterior">‹</button>':'')+'<img alt="">'+(n>1?'<button class="gnav next" aria-label="Próxima foto">›</button>':'')+'</div>'
    +'<div class="lbhint">Toque na foto para ampliar'+(n>1?' · deslize ou use as setas para trocar':'')+' · Esc para fechar</div>';
  document.body.appendChild(m);
  var img=m.querySelector("img"), prevOverflow=document.body.style.overflow;
  document.body.style.overflow="hidden";
  m.querySelector(".lbt").textContent=title||"";
  function show(k){cur=((k%n)+n)%n; img.classList.remove("z"); img.src=fotos[cur]; img.alt=(title||"Foto")+" — foto "+(cur+1); m.querySelector(".lbc").textContent=(cur+1)+"/"+n; m.querySelector(".lbo").href=fotos[cur]; if(S.curLot)galSet(cur);}
  function close(){document.removeEventListener("keydown",key); document.body.style.overflow=prevOverflow; m.remove();}
  function key(e){if(e.key==="Escape")close(); else if(e.key==="ArrowRight"&&n>1)show(cur+1); else if(e.key==="ArrowLeft"&&n>1)show(cur-1);}
  document.addEventListener("keydown",key);
  m.querySelector(".lbx").onclick=close;
  var pv=m.querySelector(".gnav.prev"),nx=m.querySelector(".gnav.next");
  if(pv)pv.onclick=function(e){e.stopPropagation();show(cur-1);};
  if(nx)nx.onclick=function(e){e.stopPropagation();show(cur+1);};
  img.onclick=function(e){e.stopPropagation(); if(img.classList.contains("z")){img.classList.remove("z");return;} var r=img.getBoundingClientRect(); img.style.transformOrigin=((e.clientX-r.left)/r.width*100)+"% "+((e.clientY-r.top)/r.height*100)+"%"; img.classList.add("z");};
  m.querySelector(".lbstage").onclick=function(e){if(e.target===this)close();};
  var tx=null,ty=null;
  m.addEventListener("touchstart",function(e){if(e.touches.length===1){tx=e.touches[0].clientX;ty=e.touches[0].clientY;}},{passive:true});
  m.addEventListener("touchend",function(e){if(tx==null||img.classList.contains("z"))return;var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(n>1&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))show(dx<0?cur+1:cur-1);},{passive:true});
  show(cur);
  m.querySelector(".lbx").focus();
}

  try{ var r=await sb.rpc("admin_metrics",{p_days:S.metricsDays||30}); if(r.error) throw r.error; S.metrics=(typeof r.data==="string")?JSON.parse(r.data):r.data; }
  catch(e){ S.metrics={__err:(e&&e.message)||"erro"}; }
  S.metricsLoading=false;
  if(S.route.name==="admin"&&S.admTab==="metricas") render();
}
function deltaBadge(cur,prev){cur=cur||0;prev=prev||0;if(prev===0){return cur>0?'<span style="color:var(--success);font-size:12px">novo</span>':'';}var p=Math.round((cur-prev)/prev*100);var col=p>=0?'var(--success)':'var(--danger)';return '<span style="color:'+col+';font-size:12px">'+(p>=0?'▲':'▼')+' '+Math.abs(p)+'%</span>';}
function kpi(lbl,val){if(typeof val==="number")val=fmtN(val);return '<div class="tile"><div class="lbl">'+lbl+'</div><div class="num">'+val+'</div></div>';}
function trendChart(trend){
  if(!trend||!trend.length) return '<p class="muted" style="font-size:13px;margin:0">Sem dados ainda.</p>';
  var max=1; trend.forEach(function(d){max=Math.max(max,d.lances||0,d.arremates||0);});
  var n=trend.length, W=Math.max(320,n*42), H=150, pad=26, step=(W-pad*2)/n, bw=step*0.34;
  var bars=trend.map(function(d,i){
    var x=pad+i*step;
    var hl=Math.round((d.lances||0)/max*(H-pad*2)); var ha=Math.round((d.arremates||0)/max*(H-pad*2));
    var day=(d.dia||"").slice(8,10);
    return '<rect x="'+x.toFixed(1)+'" y="'+(H-pad-hl)+'" width="'+bw.toFixed(1)+'" height="'+hl+'" rx="2" fill="#FC3C01"></rect>'
      +'<rect x="'+(x+bw+2).toFixed(1)+'" y="'+(H-pad-ha)+'" width="'+bw.toFixed(1)+'" height="'+ha+'" rx="2" fill="#FCBC01"></rect>'
      +'<text x="'+(x+bw).toFixed(1)+'" y="'+(H-8)+'" font-size="9" fill="#8C857A" text-anchor="middle">'+day+'</text>';
  }).join("");
  return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:320px;max-width:'+W+'px">'+bars+'</svg></div>'
    +'<div style="display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin-top:4px"><span><span style="display:inline-block;width:10px;height:10px;background:#FC3C01;border-radius:2px;margin-right:5px;vertical-align:middle"></span>Lances</span><span><span style="display:inline-block;width:10px;height:10px;background:#FCBC01;border-radius:2px;margin-right:5px;vertical-align:middle"></span>Arremates</span></div>';
}

  var kpis='<div class="tiles">'+kpi("Lotes abertos",k.lotes_abertos||0)+kpi("Lotes encerrados",k.lotes_encerrados||0)+kpi("Total de lances",k.total_lances||0)+kpi("Participantes",k.participantes_unicos||0)+kpi("Arremates",k.arremates_total||0)+kpi("Valor arrematado",brl(k.valor_arrematado||0))+kpi("Ticket médio",brl(k.ticket_medio||0))+kpi("Taxa de conversão",fmtN(k.taxa_conversao||0,null)+"%")+kpi("Média lances/lote",Number(k.media_lances_lote||0))+'</div>';
  var period='<div class="dtsec" style="margin-top:16px"><h3>Últimos '+d+' dias</h3><div class="tiles">'
    +'<div class="tile"><div class="lbl">Lances</div><div class="num">'+fmtN(per.lances)+' '+deltaBadge(per.lances,prev.lances)+'</div></div>'
    +'<div class="tile"><div class="lbl">Arremates</div><div class="num">'+fmtN(per.arremates)+' '+deltaBadge(per.arremates,prev.arremates)+'</div></div>'
    +'<div class="tile"><div class="lbl">Receita arrematada</div><div class="num" style="font-size:18px">'+brl(per.receita||0)+' '+deltaBadge(per.receita,prev.receita)+'</div></div>'
    +'<div class="tile"><div class="lbl">Receita paga</div><div class="num" style="font-size:18px">'+brl(per.receita_paga||0)+'</div></div>'
    +'<div class="tile"><div class="lbl">Novos participantes</div><div class="num">'+fmtN(per.novos_participantes)+'</div></div>'
    +'</div><p class="muted" style="font-size:12px;margin:8px 0 0">Comparação (▲/▼) contra os '+d+' dias anteriores.</p></div>';
  var abs=m.arremates_by_status||[];
  var stat='<div class="dtsec" style="margin-top:16px"><h3>Arremates por situação</h3>'+(abs.length?('<table class="adm"><thead><tr><th>Situação</th><th>Qtd.</th><th>Valor</th></tr></thead><tbody>'+abs.map(function(a){return '<tr><td>'+statusLabel(a.status)+'</td><td class="mono">'+a.qtd+'</td><td class="mono">'+brl(a.valor)+'</td></tr>';}).join("")+'</tbody></table>'):'<p class="muted" style="font-size:13px;margin:0">Nenhum arremate ainda.</p>')+'</div>';
  var tl=m.top_lots||[];
  var rank='<div class="dtsec" style="margin-top:16px"><h3>Lotes mais disputados</h3>'+(tl.length?('<table class="adm"><thead><tr><th>#</th><th>Título</th><th>Lances</th><th>Atual</th></tr></thead><tbody>'+tl.map(function(l){return '<tr><td class="mono">'+esc(l.numero)+'</td><td>'+esc(l.titulo)+'</td><td class="mono">'+fmtN(l.total_lances)+'</td><td class="mono">'+brl(l.total_lances>0?l.lance_atual:l.lance_inicial)+'</td></tr>';}).join("")+'</tbody></table>'):'<p class="muted" style="font-size:13px;margin:0">Nenhum lote ainda.</p>')+(m.lotes_sem_lances!=null?('<p class="muted" style="font-size:12px;margin:8px 0 0">'+fmtN(m.lotes_sem_lances)+' lote(s) sem lances.</p>'):"")+'</div>';
  var trend='<div class="dtsec" style="margin-top:16px"><h3>Tendência ('+d+' dias)</h3>'+trendChart(m.trend)+'</div>';
  return head+kpis+period+stat+rank+trend;
}

    +'<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-ghost btn-sm" id="dmCancel">Cancelar</button><button class="btn btn-danger btn-sm" id="dmGo" '+(risky.length?'disabled':'')+'>Excluir definitivamente</button></div>'
    +'</div></div>';
  document.body.appendChild(m);

async function mfaFactors(){ try{ var r=await sb.auth.mfa.listFactors(); return (r.data&&r.data.totp)||[]; }catch(e){ return []; } }
async function renderMfa(){
  var box=$("mfaBody"); if(!box)return;
  var fs=await mfaFactors();
  var verified=fs.filter(function(f){return f.status==="verified";});
  if(verified.length){
    box.innerHTML='<div class="note ok" style="margin:0 0 10px"><svg><use href="#i-check"/></svg><span><b>2FA ativado.</b> Sua conta pede um código do autenticador ao entrar.</span></div><button class="btn btn-line btn-sm" id="mfaOff">Desativar 2FA</button>';
    $("mfaOff").onclick=async function(){ this.disabled=true; for(var i=0;i<verified.length;i++){ await sb.auth.mfa.unenroll({factorId:verified[i].id}); } toast("2FA desativado.","info"); renderMfa(); };
  } else {
    // limpa fatores não verificados pendentes
    var pend=fs.filter(function(f){return f.status!=="verified";});
    box.innerHTML='<button class="btn btn-primary btn-sm" id="mfaOn">Ativar 2FA</button>';
    $("mfaOn").onclick=async function(){ this.disabled=true; for(var i=0;i<pend.length;i++){try{await sb.auth.mfa.unenroll({factorId:pend[i].id});}catch(e){}} openMfaEnroll(); this.disabled=false; };
  }
}
async function openMfaEnroll(){
  var en=await sb.auth.mfa.enroll({factorType:"totp"});
  if(en.error){toast("Erro ao iniciar 2FA: "+en.error.message,"bad");return;}
  var factorId=en.data.id, qr=en.data.totp.qr_code, secret=en.data.totp.secret;
  var m=document.createElement("div");m.className="modal";m.id="mfaModal";
  m.innerHTML='<div class="box"><div class="mhead"><h3>Ativar 2FA</h3><button class="mclose" id="mfaClose"><svg style="width:16px;height:16px" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><use href="#i-close"/></svg></button></div>'
    +'<div class="mbody"><p style="margin:0 0 10px;font-size:13.5px">1) Escaneie o QR no seu app autenticador (ou digite a chave). 2) Informe o código de 6 dígitos.</p>'
    +'<div id="qrHolder" style="display:flex;justify-content:center;margin:8px 0"></div>'
    +'<div class="field"><label>Chave (se não conseguir escanear)</label><input value="'+esc(secret)+'" readonly onclick="this.select()"></div>'
    +'<div class="field"><label>Código do app (6 dígitos)</label><input id="mfaCode" inputmode="numeric" maxlength="6" placeholder="000000"></div>'
    +'<div class="err" id="mfaErr" style="display:none"></div>'
    +'<button class="btn btn-primary btn-block" id="mfaVerify">Confirmar e ativar</button></div></div>';
  document.body.appendChild(m);
  if(qr){var qh=$("qrHolder");if(qh){var im=document.createElement("img");im.alt="QR 2FA";im.style.cssText="width:190px;height:190px;background:#fff;border-radius:8px;padding:6px";im.src=qr;qh.appendChild(im);}}
  var close=function(){m.remove();};
  $("mfaClose").onclick=function(){ try{sb.auth.mfa.unenroll({factorId:factorId});}catch(e){} close(); };
  m.addEventListener("click",function(e){if(e.target===m){$("mfaClose").click();}});
  $("mfaVerify").onclick=async function(){
    var code=($("mfaCode").value||"").replace(/\D/g,""); var er=$("mfaErr");
    if(code.length!==6){er.textContent="Digite os 6 dígitos.";er.style.display="block";return;}
    this.disabled=true;this.textContent="Verificando…";
    var ch=await sb.auth.mfa.challenge({factorId:factorId});
    if(ch.error){er.textContent=ch.error.message;er.style.display="block";this.disabled=false;this.textContent="Confirmar e ativar";return;}
    var vr=await sb.auth.mfa.verify({factorId:factorId,challengeId:ch.data.id,code:code});
    if(vr.error){er.textContent="Código inválido. Tente novamente.";er.style.display="block";this.disabled=false;this.textContent="Confirmar e ativar";return;}
    toast("2FA ativado com sucesso.","ok"); close(); renderMfa();
  };
}
async function stepUpMfa(){
  try{
    var a=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if(!a.data)return true;
    if(a.data.nextLevel==="aal2" && a.data.nextLevel!==a.data.currentLevel){
      var fs=await mfaFactors(); var f=fs.filter(function(x){return x.status==="verified";})[0]; if(!f)return true;
      return await new Promise(function(resolve){
        var m=document.createElement("div");m.className="modal";m.id="stepModal";
        m.innerHTML='<div class="box"><div class="mhead"><h3>Verificação em duas etapas</h3></div><div class="mbody">'
          +'<p style="margin:0 0 10px;font-size:13.5px">Digite o código de 6 dígitos do seu app autenticador para continuar.</p>'
          +'<div class="field"><input id="suCode" inputmode="numeric" maxlength="6" placeholder="000000"></div>'
          +'<div class="err" id="suErr" style="display:none"></div>'
          +'<button class="btn btn-primary btn-block" id="suGo">Verificar</button>'
          +'<button class="btn btn-ghost btn-block" id="suOut" style="margin-top:8px">Sair</button></div></div>';
        document.body.appendChild(m);
        $("suOut").onclick=async function(){await sb.auth.signOut();location.hash="#/";location.reload();};
        $("suGo").onclick=async function(){
          var code=($("suCode").value||"").replace(/\D/g,""); var er=$("suErr");
          if(code.length!==6){er.textContent="Digite os 6 dígitos.";er.style.display="block";return;}
          this.disabled=true;this.textContent="Verificando…";
          var ch=await sb.auth.mfa.challenge({factorId:f.id});
          if(ch.error){er.textContent=ch.error.message;er.style.display="block";this.disabled=false;this.textContent="Verificar";return;}
          var vr=await sb.auth.mfa.verify({factorId:f.id,challengeId:ch.data.id,code:code});
          if(vr.error){er.textContent="Código inválido.";er.style.display="block";this.disabled=false;this.textContent="Verificar";return;}
          m.remove(); resolve(true);
        };
      });
    }
  }catch(e){}
  return true;
}

  document.querySelectorAll("[data-cat]").forEach(function(b){b.onclick=function(){S.cat=this.getAttribute("data-cat");render();var el=document.getElementById("catalogo");if(el)el.scrollIntoView();};});

      } else {
        var r2=await sb.auth.signInWithPassword({email:email,password:senha});

      }
      await stepUpMfa();
      await afterAuth();location.hash="#/";
    }catch(err){er.textContent=(err&&err.message&&/Invalid login/.test(err.message))?"E-mail ou senha inválidos.":(err.message||"Não foi possível concluir.");er.style.display="block";btn.disabled=false;btn.textContent=cad?"Criar conta":"Entrar";}

function wireLotForm(){
  var lf=$("lotForm");if(!lf)return;
  var cancel=lf.querySelector("[data-cancel]");if(cancel)cancel.onclick=function(){S.admTab="lotes";render();};
  var fotos=[]; try{fotos=JSON.parse(lf.getAttribute("data-fotos")||"[]");}catch(e){fotos=[];}
  var prev=$("fotoPrev"), inp=$("fotoInput");
  function renderPrev(){
    if(!prev)return;
    prev.innerHTML=fotos.map(function(u,i){return '<div class="fthumb"><img src="'+esc(u)+'" alt="foto '+(i+1)+'">'+(i===0?'<span class="capa">capa</span>':'')+'<button type="button" class="rmf" data-rm="'+i+'" aria-label="Remover">&times;</button></div>';}).join("")
      + '<label class="fadd" for="fotoInput">+<span>foto</span></label>';
    prev.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){fotos.splice(+this.getAttribute("data-rm"),1);renderPrev();};});
  }
  renderPrev();
  if(inp)inp.onchange=async function(){
    var files=Array.prototype.slice.call(this.files||[]); if(!files.length)return;
    var sub=lf.querySelector('button[type="submit"]'); if(sub)sub.disabled=true;
    toast("Enviando "+files.length+" foto(s)…");
    for(var k=0;k<files.length;k++){
      var file=files[k];
      var safe=(file.name||"foto").replace(/[^a-zA-Z0-9._-]/g,"_");
      var path=(Date.now()+"-"+Math.random().toString(36).slice(2))+"-"+safe;
      var up=await sb.storage.from("lotes").upload(path,file,{cacheControl:"3600",upsert:false});
      if(up.error){toast("Erro ao enviar "+safe+": "+up.error.message,"bad");continue;}
      var pub=sb.storage.from("lotes").getPublicUrl(path);
      if(pub&&pub.data&&pub.data.publicUrl)fotos.push(pub.data.publicUrl);
    }
    this.value=""; if(sub)sub.disabled=false; renderPrev(); toast("Fotos enviadas.","ok");
  };
  lf.onsubmit=async function(e){e.preventDefault();var f=new FormData(lf),id=lf.getAttribute("data-id");
    var pu=String(f.get("planilha_url")||"").trim(); if(pu&&!sheetUrls(pu)){toast("Link da planilha inválido. Cole o link completo começando com https://","bad");return;}
    var fotosObj=fotos.map(function(u){return{url:u};});
    var obj={numero:parseInt(f.get("numero")),titulo:f.get("titulo"),categoria:f.get("categoria")||null,condicao:f.get("condicao")||null,qtd_estimada:f.get("qtd_estimada")||null,provavel_conteudo:f.get("provavel_conteudo")||null,descricao:f.get("descricao")||null,planilha_url:(String(f.get("planilha_url")||"").trim()||null),local_retirada:f.get("local_retirada")||null,fotos:fotosObj,lance_inicial:reaisToCents(f.get("lance_inicial")),incremento:reaisToCents(f.get("incremento")),abre_em:f.get("abre_em")?new Date(f.get("abre_em")).toISOString():null,encerra_em:f.get("encerra_em")?new Date(f.get("encerra_em")).toISOString():null,status:f.get("status")};
    var r=id?await sb.from("lots").update(obj).eq("id",id):await sb.from("lots").insert(obj);
    if(r.error){toast("Erro: "+(r.error.message||""),"bad");return;}
    await loadLots();S.admTab="lotes";toast(id?"Lote salvo.":"Lote criado.","ok");render();};
}

/* ===== auth lifecycle + router ===== */
async function afterAuth(){await loadProfile();await loadMine();subscribeRealtime();}
async function boot(){
  try{var st=localStorage.getItem("sbx_theme");if(st)document.documentElement.setAttribute("data-theme",st);}catch(e){}
  var s=await sb.auth.getSession();S.session=s.data.session||null;
  if(S.session){await stepUpMfa();}
  await loadConfig();await loadLots();await loadAgenda();
  if(S.session){await loadProfile();await loadMine();}
  subscribeRealtime();
  sb.auth.onAuthStateChange(function(_e,sess){S.session=sess||null;if(_e==="PASSWORD_RECOVERY"){location.hash="#/redefinir";route();}});
  route();
}
async function route(){
  var h=location.hash.replace(/^#/,"")||"/";
  var parts=h.split("/").filter(Boolean); // e.g. ['lote','104'] or ['conta','lances']
  var name=parts[0]||"home";
  if(h==="/"||h===""){name="home";}
  if(name==="lote"){S.route={name:"lote"};await loadLot(parseInt(parts[1]));}
  else if(name==="conta"){S.route={name:"conta"};S.acctTab=parts[1]||"visao";if(S.session){await loadMine();await loadProfile();}}
  else if(name==="admin"){S.route={name:"admin"};if(isAdmin()){await loadLots();await loadMine();await loadAgenda();}}
  else if(name==="sair"){await sb.auth.signOut();S.session=null;S.profile=null;S.myBids=[];S.arremates=[];toast("Você saiu da conta.");location.hash="#/";return;}
  else if(["como","agenda","ajuda","entrar","cadastrar","recuperar","redefinir"].indexOf(name)>=0){S.route={name:name};if(name==="agenda")await loadAgenda();}
  else {S.route={name:"home"};}
  render();window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
boot();
</script>
