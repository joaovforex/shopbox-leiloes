@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12100C; --surface:#1B1712; --surface-2:#211C16; --surface-3:#2A241C;
  --ink:#F2ECE1; --ink-2:#B8AF9F; --ink-3:#8A8171; --line:#2E281F; --line-2:#3A3227;
  --brand-soft:#3A1A0C; --gold-soft:#33280F; --success-soft:#122A1C; --danger-soft:#33141A;
}}
:root[data-theme="dark"]{
  --bg:#12100C; --surface:#1B1712; --surface-2:#211C16; --surface-3:#2A241C;
  --ink:#F2ECE1; --ink-2:#B8AF9F; --ink-3:#8A8171; --line:#2E281F; --line-2:#3A3227;
  --brand-soft:#3A1A0C; --gold-soft:#33280F; --success-soft:#122A1C; --danger-soft:#33141A;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--dsp);font-weight:800;letter-spacing:-.01em;margin:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
.mono{font-family:var(--mono)}
button{font-family:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--radius);padding:12px 18px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-deep)}
.btn-line{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}.btn-line:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--ink-2)}.btn-ghost:hover{color:var(--ink)}
.btn-sm{padding:8px 12px;font-size:13px}
.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-3);color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em}
.tag.brand{background:var(--brand-soft);color:var(--brand-deep)}
.tag.ok{background:var(--success-soft);color:var(--success)}
.tag.warn{background:var(--danger-soft);color:var(--danger)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0 0 5px}
input,select,textarea{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink)}
input:focus,select,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.field{margin-bottom:12px}
.err{color:var(--danger);font-size:12px;margin-top:4px}
.muted{color:var(--ink-3)}
/* header */
header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:18px;height:64px}
.brandlogo{width:150px;height:40px;background:var(--logo) left center/contain no-repeat;flex:none}
.mainmenu{display:flex;gap:4px;margin-left:8px}
.mainmenu a{padding:8px 12px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;color:var(--ink-2)}
.mainmenu a:hover,.mainmenu a.on{color:var(--brand);background:var(--brand-soft)}
.navspace{flex:1}
.iconbtn{width:40px;height:40px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.userchip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:13px}
.userchip .av{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px}
.burger{display:none;width:40px;height:40px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
@media(max-width:980px){.mainmenu{display:none}.burger{display:grid;place-items:center}.hidemob{display:none!important}.brandlogo{width:120px}}
.msheet{position:fixed;inset:0;z-index:90;background:rgba(15,10,4,.5)}
.msheet[hidden]{display:none!important}
.msheet .panel{position:absolute;top:0;right:0;bottom:0;width:min(300px,86vw);background:var(--surface);padding:20px 16px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.msheet .panel a{padding:13px 12px;border-radius:8px;font-weight:600;color:var(--ink)}
.msheet .panel a:hover{background:var(--surface-2)}
.msheet .panel hr{border:none;border-top:1px solid var(--line);margin:10px 0;width:100%}
/* hero */
.hero{padding:46px 0 30px}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.03}
.hero h1 .hl{color:var(--brand)}
.hero p{max-width:540px;color:var(--ink-2);font-size:16px;margin:14px 0 22px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--dsp);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.herobtns{display:flex;gap:12px;flex-wrap:wrap}
/* section */
.sec{padding:8px 0 40px}
.sechead{margin-bottom:18px}
.sechead .k{font-family:var(--dsp);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.sechead .k::before{content:"";width:22px;height:2px;background:var(--brand)}
.sechead h2{font-size:clamp(22px,3vw,30px)}
.sechead p{color:var(--ink-2);margin:6px 0 0}
/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.search{flex:1;min-width:200px;position:relative}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip .n{background:rgba(0,0,0,.08);border-radius:999px;padding:0 7px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.25)}
/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:16px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.15s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.ph{position:relative;aspect-ratio:16/11;background:var(--surface-3);display:grid;place-items:center;color:var(--ink-3)}
.ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ph .noimg{text-align:center;font-size:12px}
.ph .noimg svg{width:34px;height:34px;opacity:.5;display:block;margin:0 auto 6px}
.badges{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px}
.lotnum{font-family:var(--mono);font-size:11px;font-weight:700;background:rgba(22,18,13,.82);color:#fff;padding:4px 8px;border-radius:6px}
.cbody{padding:14px 15px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.ccat{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.ctit{font-family:var(--dsp);font-weight:700;font-size:18px;line-height:1.15}
.cmeta{font-size:12.5px;color:var(--ink-2)}
.pricerow{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.pricerow .lbl{font-size:11.5px;color:var(--ink-3);font-weight:600}
.pricerow .val{font-family:var(--mono);font-weight:700}
.big{font-size:20px}
.timer{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}
.timer .cd{font-family:var(--mono);font-weight:700;color:var(--ink)}
.timer.urgent .cd{color:var(--danger)}
.closed{color:var(--ink-3);font-weight:600;font-size:12.5px}
/* lot detail */
.dt-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:26px;align-items:start;margin-top:14px}
@media(max-width:860px){.dt-grid{grid-template-columns:1fr}}
.gallery{aspect-ratio:16/11;border-radius:var(--radius-lg);background:var(--surface-3);display:grid;place-items:center;color:var(--ink-3);overflow:hidden;position:relative}
.gallery img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumbs div{width:64px;height:52px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;color:var(--ink-3);overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover}
.bidbox{position:sticky;top:80px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-md)}
.bidbox .lbl{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.bidbox .price{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1}
.stepper{display:flex;gap:8px;margin:14px 0 8px}
.stepper button{width:44px;height:44px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);font-size:20px;color:var(--brand)}
.stepper input{text-align:center;font-family:var(--mono);font-weight:700;font-size:16px}
.quick{display:flex;gap:8px;margin-bottom:12px}
.quick button{flex:1}
.note{background:var(--info);background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-size:12.5px;padding:10px 12px;border-radius:var(--radius-sm);display:flex;gap:8px;margin-top:10px}
.note svg{width:16px;height:16px;flex:none;margin-top:1px}
.note.warn{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.note.ok{background:var(--success-soft);border-color:transparent;color:var(--success)}
.dtsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px;margin-top:14px}
.dtsec h3{font-size:16px;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-2)}
.kv .v{font-weight:600;text-align:right}
.hist{font-size:13px;color:var(--ink-2)}
.hist .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin:14px 0}
.crumb a{color:var(--brand);font-weight:600}
/* steps */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:6px;counter-reset:st}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px}
.step .n{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;font-family:var(--dsp);font-weight:800;display:grid;place-items:center;margin-bottom:10px}
.step h3{font-size:16px;margin-bottom:5px}
.step p{font-size:13px;color:var(--ink-2);margin:0}
/* account */
.acct{display:grid;grid-template-columns:220px 1fr;gap:22px;margin-top:16px;align-items:start}
@media(max-width:820px){.acct{grid-template-columns:1fr}.acct-side{position:static!important;flex-direction:row;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding-bottom:8px}}
.acct-side{position:sticky;top:80px;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:8px}
.acct-side a{padding:11px 13px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;color:var(--ink-2);display:flex;gap:9px;align-items:center;white-space:nowrap}
.acct-side a.on,.acct-side a:hover{background:var(--brand-soft);color:var(--brand)}
.acct-side svg{width:16px;height:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px}
.tile .lbl{font-size:12px;color:var(--ink-3);font-weight:600}
.tile .num{font-family:var(--dsp);font-size:30px;font-weight:800}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--radius-lg);padding:34px 18px;text-align:center;color:var(--ink-3)}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:8px}
.empty b{color:var(--ink-2);display:block;font-size:15px;margin-bottom:4px}
.listrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.listrow .mini{width:44px;height:44px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;color:var(--ink-3);flex:none;overflow:hidden}
.listrow .mini img{width:100%;height:100%;object-fit:cover}
.listrow .g{flex:1;min-width:0}
.listrow .t{font-weight:700;font-size:14px}
.listrow .s{font-size:12.5px;color:var(--ink-2)}
/* footer */
footer{background:var(--panel);color:var(--panel-ink);margin-top:40px;border-top:3px solid var(--brand)}
.foot{display:grid;grid-template-columns:1.7fr 1fr 1fr 1.2fr;gap:32px;padding:40px 0 28px}
@media(max-width:820px){.foot{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.foot{grid-template-columns:1fr}}
.foot h4{font-family:var(--dsp);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#B9AF9F;margin-bottom:12px}
.foot a,.foot p{display:block;color:#CFC6B8;font-size:13.5px;margin-bottom:8px}
.foot a:hover{color:#fff}
.footlogo{width:150px;height:40px;background:var(--logo) left center/contain no-repeat;filter:brightness(0) invert(1);opacity:.92;margin-bottom:12px}
.footbar{border-top:1px solid var(--panel-line);padding:16px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:#8F8676}
/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,10,4,.55);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.modal .box{background:var(--surface);border-radius:var(--radius-lg);width:min(460px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal .box.big{width:min(680px,100%)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:18px}
.mbody{padding:18px 20px}
.mclose{width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);display:grid;place-items:center}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:440px){.formrow{grid-template-columns:1fr}}
/* toast */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--panel);color:#fff;padding:11px 16px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;gap:8px;align-items:center}
.toast svg{width:16px;height:16px}
.toast.ok{background:var(--success)}.toast.bad{background:var(--danger)}
/* admin */
.adm-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.adm-tabs button{padding:9px 14px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13px;color:var(--ink-2)}
.adm-tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
table.adm{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;font-size:13px}
table.adm th,table.adm td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
table.adm th{background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-3)}
.loading{padding:40px;text-align:center;color:var(--ink-3)}
.spin{width:22px;height:22px;border:3px solid var(--line-2);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
</style>

<script>
"use strict";
/* ===== Supabase ===== */
var SB_URL="https://voxnmfnyfubzvodylxos.supabase.co", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZveG5tZm55ZnVienZvZHlseG9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMTQ3NTgsImV4cCI6MjEwNTU5MDc1OH0.pNUy6Xa9PauOyTne8nOaa9UKMDMOStPREsKLeQ9pqqk";
var WA="5541999232414"; // WhatsApp fallback (config.whatsapp sobrescreve)
var sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true,autoRefreshToken:true}});
var MIN=60000;
/* ===== estado ===== */
var S = { session:null, profile:null, lots:[], config:{}, agenda:[], route:{name:"home"},
          curLot:null, curBids:[], myBids:[], arremates:[], acctTab:"visao", admTab:"lotes", cat:"", q:"" };

/* ===== util ===== */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function brl(cents){return "R$ "+(Number(cents||0)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function reaisToCents(v){v=String(v).replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",",".");var n=parseFloat(v);return isNaN(n)?0:Math.round(n*100);}
function fmtDT(iso){if(!iso)return "—";var d=new Date(iso);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",timeZone:"America/Sao_Paulo"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"});}
function minBid(l){return (l.total_lances===0)?l.lance_inicial:(l.lance_atual+l.incremento);}
function curVal(l){return (l.total_lances===0)?l.lance_inicial:l.lance_atual;}
function left(iso){if(!iso)return{txt:"—",urgent:false,closed:false};var ms=new Date(iso)-Date.now();if(ms<=0)return{txt:"Encerrado",urgent:false,closed:true};var s=Math.floor(ms/1000),d=Math.floor(s/86400);s-=d*86400;var h=Math.floor(s/3600);s-=h*3600;var m=Math.floor(s/60);s-=m*60;var p=function(n){return(n<10?"0":"")+n;};return{txt:d>0?(d+"d "+p(h)+":"+p(m)+":"+p(s)):(p(h)+":"+p(m)+":"+p(s)),urgent:ms<15*MIN,closed:false};}
function toast(msg,kind){var t=document.createElement("div");t.className="toast "+(kind||"");var ic=kind==="bad"?"i-close":(kind==="ok"?"i-check":"i-info");t.innerHTML='<svg><use href="#'+ic+'"/></svg><span>'+esc(msg)+'</span>';$("toasts").appendChild(t);setTimeout(function(){t.style.transition="opacity .3s";t.style.opacity="0";setTimeout(function(){t.remove();},300);},3600);}
function initials(n){n=(n||"?").trim();var p=n.split(/\s+/);return((p[0]||"")[0]||"?").toUpperCase()+((p[1]||"")[0]||"").toUpperCase();}
function maskName(n){n=(n||"Participante").trim();var p=n.split(/\s+/);return p[0]+(p[1]?(" "+p[1][0]+"."):"");}
var ERR={nao_autenticado:"Entre na sua conta para dar um lance.",lote_inexistente:"Lote não encontrado.",lote_nao_aberto:"Este lote não está aberto para lances.",ainda_nao_abriu:"Este lote ainda não abriu.",lote_encerrado:"Este lote já encerrou.",valor_abaixo_minimo:"Seu lance está abaixo do mínimo."};

/* ===== data ===== */
async function loadConfig(){try{var r=await sb.from("config").select("*").eq("id",1).maybeSingle();if(r.data){S.config=r.data;if(r.data.whatsapp)WA=String(r.data.whatsapp).replace(/\D/g,"")||WA;}}catch(e){}}
async function loadLots(){var r=await sb.from("lots").select("*").in("status",["aberto","agendado","encerrado"]).order("status",{ascending:true}).order("encerra_em",{ascending:true});S.lots=r.data||[];}
async function loadLot(numero){var r=await sb.from("lots").select("*").eq("numero",numero).maybeSingle();S.curLot=r.data||null;if(S.curLot){var b=await sb.from("bids").select("valor,criado_em,user_id").eq("lot_id",S.curLot.id).order("criado_em",{ascending:false}).limit(12);S.curBids=b.data||[];}}
async function loadAgenda(){var r=await sb.from("agenda").select("*").eq("status","previsto").order("quando",{ascending:true});S.agenda=r.data||[];}
async function loadProfile(){if(!S.session){S.profile=null;return;}var r=await sb.from("profiles").select("*").eq("id",S.session.user.id).maybeSingle();S.profile=r.data||null;}
async function loadMine(){if(!S.session){S.myBids=[];S.arremates=[];return;}
  var mb=await sb.from("bids").select("valor,criado_em,lot_id,lots(numero,titulo,status,lance_atual,vencedor_id,fotos,encerra_em)").eq("user_id",S.session.user.id).order("criado_em",{ascending:false});
  var seen={},list=[];(mb.data||[]).forEach(function(b){if(b.lots&&!seen[b.lot_id]){seen[b.lot_id]=1;list.push({lot:b.lots,meuLance:b.valor});}});S.myBids=list;
  var ar=await sb.from("arremates").select("*,lots(numero,titulo)").eq("user_id",S.session.user.id).order("criado_em",{ascending:false});S.arremates=ar.data||[];}

/* ===== render root ===== */
function catCounts(){var m={};S.lots.forEach(function(l){if(l.categoria)m[l.categoria]=(m[l.categoria]||0)+1;});return m;}
function isAdmin(){return S.profile&&S.profile.role==="admin";}

function render(){
  var app=$("app");
  app.innerHTML = header() + main() + footer();

  var side='<div class="acct-side">'+tabs.map(function(t){return '<a href="#/conta/'+t[0]+'" class="'+(S.acctTab===t[0]?"on":"")+'"><svg><use href="#'+t[2]+'"/></svg>'+t[1]+'</a>';}).join("")+'</div>';
  return '<div class="wrap"><div class="acct">'+side+'<div>'+contaMain()+'</div></div><div style="height:30px"></div></div>';
}
function contaMain(){
  var t=S.acctTab;
  if(t==="visao"){
    var ativos=S.myBids.filter(function(m){return m.lot.status==="aberto";}).length;
    var venc=S.myBids.filter(function(m){return m.lot.status==="aberto"&&m.lot.vencedor_id===S.session.user.id;}).length;
    var arr=S.arremates.length;
    var rows=S.myBids.slice(0,5).map(bidRow).join("");
    return '<h2 style="font-size:22px;margin-bottom:14px">Visão geral</h2>'
      +'<div class="tiles"><div class="tile"><div class="lbl">Lances ativos</div><div class="num">'+ativos+'</div></div><div class="tile"><div class="lbl">Arremates</div><div class="num">'+arr+'</div></div><div class="tile"><div class="lbl">Vencendo agora</div><div class="num">'+venc+'</div></div></div>'
      +'<div style="margin-top:16px">'+(rows||'<div class="empty"><svg><use href="#i-gavel"/></svg><b>Você ainda não deu lances</b>Explore os lotes disponíveis e participe.</div>')+'</div>';
  }
  if(t==="lances"){var r=S.myBids.map(bidRow).join("");return '<h2 style="font-size:22px;margin-bottom:14px">Meus lances</h2>'+(r||'<div class="empty"><svg><use href="#i-gavel"/></svg><b>Nenhum lance ainda</b>Seus lances aparecerão aqui.</div>');}
  if(t==="arremates"){var r=S.arremates.map(function(a){return '<div class="listrow"><div class="mini"><svg style="width:18px;height:18px" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><use href="#i-check"/></svg></div><div class="g"><div class="t">'+esc(a.lots&&a.lots.titulo||"Lote")+'</div><div class="s">#'+esc(a.lots&&a.lots.numero)+' · '+brl(a.valor)+' · '+statusLabel(a.status)+'</div></div><a class="btn btn-line btn-sm" target="_blank" rel="noopener" href="https://wa.me/'+WA+'?text='+encodeURIComponent("Olá! Sobre meu arremate do lote #"+(a.lots&&a.lots.numero)+" ("+(a.lots&&a.lots.titulo)+")")+'">Falar no WhatsApp</a></div>';}).join("");
    return '<h2 style="font-size:22px;margin-bottom:14px">Arremates</h2>'+(r||'<div class="empty"><svg><use href="#i-check"/></svg><b>Nenhum arremate ainda</b>Quando você vencer um lote, ele aparece aqui com os próximos passos.</div>');}
  if(t==="pagamentos"){
    var pend=S.arremates.filter(function(a){return a.status==="aguardando_pagamento";});
    var body=pend.length?pend.map(function(a){return '<div class="dtsec"><h3>Lote #'+esc(a.lots&&a.lots.numero)+' — '+esc(a.lots&&a.lots.titulo)+'</h3>'
        +'<div class="kv"><span class="k">Valor</span><span class="v mono">'+brl(a.valor)+'</span></div>'
        +'<div class="kv"><span class="k">Chave Pix</span><span class="v">'+(S.config.pix_chave?esc(S.config.pix_chave):'<span class="muted">A confirmar</span>')+'</span></div>'
        +'<div class="kv"><span class="k">Situação</span><span class="v">'+statusLabel(a.status)+'</span></div>'
        +'<a class="btn btn-primary btn-sm" style="margin-top:10px" target="_blank" rel="noopener" href="https://wa.me/'+WA+'?text='+encodeURIComponent("Olá! Quero pagar o arremate do lote #"+(a.lots&&a.lots.numero))+'">Combinar pagamento no WhatsApp</a></div>';}).join("")
      :'<div class="empty"><svg><use href="#i-card"/></svg><b>Sem pagamentos pendentes</b>Nesta fase, o pagamento do arremate é combinado por Pix e WhatsApp. Valores e comprovantes aparecerão aqui.</div>';
    return '<h2 style="font-size:22px;margin-bottom:14px">Pagamentos</h2>'+body;
  }
  if(t==="retiradas"){return '<h2 style="font-size:22px;margin-bottom:14px">Retiradas / entregas</h2><div class="empty"><svg><use href="#i-truck"/></svg><b>Sem retiradas no momento</b>Após pagar um arremate, as instruções de retirada ou entrega aparecerão aqui. Local: '+(S.config.endereco?esc(S.config.endereco):"a confirmar")+'.</div>';}
  if(t==="dados"){var p=S.profile||{};return '<h2 style="font-size:22px;margin-bottom:14px">Meus dados</h2>'
    +'<form id="dadosForm" class="dtsec"><div class="field"><label>Nome</label><input name="nome" value="'+esc(p.nome||"")+'"></div>'
    +'<div class="formrow"><div class="field"><label>Cidade</label><input name="cidade" value="'+esc(p.cidade||"")+'"></div><div class="field"><label>WhatsApp</label><input name="whatsapp" value="'+esc(p.whatsapp||"")+'"></div></div>'
    +'<div class="field"><label>E-mail</label><input value="'+esc(S.session.user.email)+'" disabled></div>'
    +'<button class="btn btn-primary btn-sm" id="dadosBtn" type="submit">Salvar alterações</button> <a class="btn btn-ghost btn-sm" href="#/sair">Sair da conta</a></form>';}
  if(t==="ajuda"){return '<h2 style="font-size:22px;margin-bottom:14px">Ajuda</h2><div class="dtsec"><p style="margin:0 0 12px;color:var(--ink-2)">Precisa de ajuda com um lote ou pedido? Fale com a gente.</p><a class="btn btn-primary btn-sm" target="_blank" rel="noopener" href="https://wa.me/'+WA+'">Abrir WhatsApp</a> <a class="btn btn-line btn-sm" href="#/ajuda">Perguntas frequentes</a></div>';}
  return "";
}
function bidRow(m){
  var l=m.lot,winning=l.vencedor_id===S.session.user.id,enc=l.status==="encerrado";
  var st=enc?(winning?'<span class="tag ok">Arrematado</span>':'<span class="tag">Encerrado</span>'):(winning?'<span class="tag ok">Vencendo</span>':'<span class="tag warn">Superado</span>');
  var foto=(l.fotos&&l.fotos[0]&&l.fotos[0].url)?l.fotos[0].url:"";
  return '<div class="listrow"><div class="mini">'+(foto?'<img src="'+esc(foto)+'">':'<svg style="width:18px;height:18px" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><use href="#i-img"/></svg>')+'</div>'
    +'<div class="g"><div class="t">'+esc(l.titulo)+'</div><div class="s">#'+esc(l.numero)+' · seu lance '+brl(m.meuLance)+' · atual '+brl(l.lance_atual||l.lance_inicial)+'</div></div>'
    +st+' <a class="btn btn-line btn-sm" href="#/lote/'+esc(l.numero)+'">Ver lote</a></div>';
}
function statusLabel(s){return {aguardando_pagamento:"Aguardando pagamento",pago:"Pago",retirado:"Retirado",cancelado:"Cancelado"}[s]||s;}

/* ===== render + wire (parte 2 no próximo bloco) ===== */
window.__render=render;

<script>
/* ===== ADMIN view ===== */

    body='<table class="adm"><thead><tr><th>#</th><th>Título</th><th>Status</th><th>Atual</th><th>Encerra</th><th></th></tr></thead><tbody>'

        +'<button class="btn btn-ghost btn-sm" data-edit="'+l.id+'">Editar</button></td></tr>';}).join(""):'<tr><td colspan="6" class="muted" style="text-align:center;padding:20px">Nenhum lote cadastrado.</td></tr>')
      +'</tbody></table>';
  } else if(S.admTab==="novo"){ body=lotForm(null); }
  else if(S.admTab==="arremates"){
    body='<table class="adm"><thead><tr><th>Lote</th><th>Valor</th><th>Situação</th><th>Ações</th></tr></thead><tbody>'
      +(S.arremates.length?S.arremates.map(function(a){return '<tr><td>#'+esc(a.lots&&a.lots.numero)+' — '+esc(a.lots&&a.lots.titulo)+'</td><td class="mono">'+brl(a.valor)+'</td><td>'+statusLabel(a.status)+'</td>'
        +'<td style="white-space:nowrap">'+(a.status==="aguardando_pagamento"?'<button class="btn btn-primary btn-sm" data-pay="'+a.id+'">Marcar pago</button> ':"")+(a.status==="pago"?'<button class="btn btn-line btn-sm" data-deliver="'+a.id+'">Marcar retirado</button>':"")+'</td></tr>';}).join(""):'<tr><td colspan="4" class="muted" style="text-align:center;padding:20px">Nenhum arremate ainda.</td></tr>')
      +'</tbody></table>';
  } else if(S.admTab==="agenda"){
    body='<div class="dtsec"><h3>Novo item de agenda</h3><form id="agForm"><div class="formrow"><div class="field"><label>Título *</label><input name="titulo" required></div><div class="field"><label>Categoria</label><input name="categoria"></div></div><div class="formrow"><div class="field"><label>Data e hora *</label><input name="quando" type="datetime-local" required></div><div class="field"><label>Qtd. de lotes</label><input name="qtd_lotes" type="number"></div></div><button class="btn btn-primary btn-sm" type="submit">Adicionar</button></form></div>'
      +'<table class="adm" style="margin-top:14px"><thead><tr><th>Título</th><th>Quando</th><th>Lotes</th></tr></thead><tbody>'+(S.agenda.length?S.agenda.map(function(a){return '<tr><td>'+esc(a.titulo)+'</td><td>'+esc(fmtDT(a.quando))+'</td><td>'+esc(a.qtd_lotes||"—")+'</td></tr>';}).join(""):'<tr><td colspan="3" class="muted" style="text-align:center;padding:16px">Sem itens.</td></tr>')+'</tbody></table>';
  } else if(S.admTab==="config"){
    var c=S.config||{};
    function f(n,lbl,ph){return '<div class="field"><label>'+lbl+'</label><input name="'+n+'" value="'+esc(c[n]||"")+'" placeholder="'+(ph||"")+'"></div>';}
    function ta(n,lbl){return '<div class="field"><label>'+lbl+'</label><textarea name="'+n+'" rows="2">'+esc(c[n]||"")+'</textarea></div>';}
    body='<form id="cfgForm" class="dtsec"><h3>Dados da empresa</h3><div class="formrow">'+f("razao_social","Razão social")+f("cnpj","CNPJ")+'</div><div class="formrow">'+f("endereco","Endereço")+f("cidade","Cidade")+'</div><div class="formrow">'+f("email","E-mail")+f("whatsapp","WhatsApp (só números)")+'</div>'+f("horarios","Horários de atendimento")+f("pix_chave","Chave Pix (pagamento manual)")
      +'<h3 style="margin-top:14px">Regras e textos oficiais</h3>'+ta("regras","Regras do leilão")+ta("pagamento","Condições de pagamento / taxas")+ta("retirada","Retirada / entrega")+ta("privacidade","Política de privacidade")

  return head+body+'<div style="height:30px"></div></div>';

function statusChip(s){var m={rascunho:["Rascunho",""],agendado:["Agendado","gold"],aberto:["Aberto","ok"],encerrado:["Encerrado",""],cancelado:["Cancelado","warn"]}[s]||[s,""];return '<span class="tag '+m[1]+'">'+m[0]+'</span>';}
function lotForm(l){
  l=l||{};
  function v(k,d){return l[k]!=null?l[k]:(d||"");}
  return '<form id="lotForm" class="dtsec" data-id="'+esc(l.id||"")+'"><h3>'+(l.id?"Editar lote #"+esc(l.numero):"Novo lote")+'</h3>'
    +'<div class="formrow"><div class="field"><label>Número do lote *</label><input name="numero" type="number" value="'+esc(v("numero"))+'" required></div><div class="field"><label>Categoria</label><input name="categoria" value="'+esc(v("categoria"))+'" placeholder="Eletrônicos, Informática…"></div></div>'
    +'<div class="field"><label>Título *</label><input name="titulo" value="'+esc(v("titulo"))+'" required placeholder="Lote de Eletrônicos — Pallet Misto"></div>'
    +'<div class="formrow"><div class="field"><label>Condição</label><input name="condicao" value="'+esc(v("condicao"))+'" placeholder="Novo / Novo/Saldo / Misto"></div><div class="field"><label>Qtd. estimada</label><input name="qtd_estimada" value="'+esc(v("qtd_estimada"))+'" placeholder="≈ 150 itens"></div></div>'
    +'<div class="field"><label>Provável conteúdo</label><textarea name="provavel_conteudo" rows="2">'+esc(v("provavel_conteudo"))+'</textarea></div>'
    +'<div class="field"><label>Descrição</label><textarea name="descricao" rows="2">'+esc(v("descricao"))+'</textarea></div>'
    +'<div class="field"><label>Local de retirada</label><input name="local_retirada" value="'+esc(v("local_retirada"))+'"></div>'
    +'<div class="field"><label>Fotos (URLs separadas por vírgula)</label><input name="fotos" value="'+esc((l.fotos||[]).map(function(f){return f.url;}).join(", "))+'" placeholder="https://…/foto1.jpg, https://…/foto2.jpg"></div>'
    +'<div class="formrow"><div class="field"><label>Lance inicial (R$) *</label><input name="lance_inicial" value="'+esc(l.lance_inicial!=null?(l.lance_inicial/100).toFixed(2).replace(".",","):"")+'" required placeholder="1600,00"></div><div class="field"><label>Incremento (R$) *</label><input name="incremento" value="'+esc(l.incremento!=null?(l.incremento/100).toFixed(2).replace(".",","):"50,00")+'" required></div></div>'
    +'<div class="formrow"><div class="field"><label>Abre em</label><input name="abre_em" type="datetime-local" value="'+esc(toLocalInput(l.abre_em))+'"></div><div class="field"><label>Encerra em *</label><input name="encerra_em" type="datetime-local" value="'+esc(toLocalInput(l.encerra_em))+'"></div></div>'
    +'<div class="field"><label>Status</label><select name="status">'+["rascunho","agendado","aberto","encerrado","cancelado"].map(function(s){return '<option value="'+s+'" '+(v("status","rascunho")===s?"selected":"")+'>'+s+'</option>';}).join("")+'</select></div>'
    +'<button class="btn btn-primary btn-sm" type="submit">'+(l.id?"Salvar lote":"Criar lote")+'</button>'+(l.id?' <button class="btn btn-ghost btn-sm" type="button" data-cancel="1">Cancelar</button>':"")+'</form>';
}
function toLocalInput(iso){if(!iso)return "";var d=new Date(iso);var p=function(n){return(n<10?"0":"")+n;};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes());}
</script>
<script>
/* ===== bid review modal ===== */
function openBidReview(l,valorCents){
  var m=document.createElement("div");m.className="modal";m.id="bidModal";
  m.innerHTML='<div class="box"><div class="mhead"><h3>Revisar lance</h3><button class="mclose" id="bmClose"><svg style="width:16px;height:16px" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><use href="#i-close"/></svg></button></div>'
    +'<div class="mbody" id="bmBody">'
    +'<div class="kv"><span class="k">Lote</span><span class="v">#'+esc(l.numero)+' — '+esc(l.titulo)+'</span></div>'
    +'<div class="kv"><span class="k">Seu lance</span><span class="v mono big">'+brl(valorCents)+'</span></div>'
    +'<div class="kv"><span class="k">Taxa / comissão</span><span class="v">'+(S.config.pagamento?esc(S.config.pagamento):'<span class="muted">A confirmar</span>')+'</span></div>'
    +'<div class="kv"><span class="k">Total estimado</span><span class="v">'+(S.config.pagamento?'<span class="muted">A confirmar</span>':'<span class="muted">A confirmar</span>')+'</span></div>'
    +'<div class="kv"><span class="k">Pagamento</span><span class="v">Pix / WhatsApp</span></div>'
    +'<div class="kv"><span class="k">Retirada / entrega</span><span class="v">'+(S.config.retirada?esc(S.config.retirada):'<span class="muted">A confirmar</span>')+'</span></div>'
    +'<div class="note"><svg><use href="#i-info"/></svg><span>Taxas e total podem ser definidos por pregão. <a href="#/ajuda" style="color:var(--brand)">Ver regras</a>.</span></div>'
    +'<button class="btn btn-primary btn-block" id="bmConfirm" style="margin-top:12px">Confirmar lance de '+brl(valorCents)+'</button>'
    +'</div></div>';
  document.body.appendChild(m);
  var close=function(){m.remove();};
  $("bmClose").onclick=close;m.addEventListener("click",function(e){if(e.target===m)close();});
  $("bmConfirm").onclick=async function(){
    var btn=this;btn.disabled=true;btn.textContent="Processando…";
    var r=await sb.rpc("place_bid",{p_lot_id:l.id,p_valor:valorCents});
    if(r.error){btn.disabled=false;btn.textContent="Confirmar lance de "+brl(valorCents);toast("Erro ao registrar o lance. Tente novamente.","bad");return;}
    var res=r.data;
    if(!res||!res.ok){
      btn.disabled=false;btn.textContent="Confirmar lance de "+brl(valorCents);
      var msg=ERR[res&&res.erro]||"Não foi possível registrar o lance.";
      if(res&&res.erro==="valor_abaixo_minimo")msg="Lance abaixo do mínimo ("+brl(res.minimo)+").";
      toast(msg,"bad");
      if(res&&(res.erro==="lote_encerrado"||res.erro==="lote_nao_aberto")){await refreshCurrent();}
      return;
    }
    $("bmBody").innerHTML='<div class="note ok"><svg><use href="#i-check"/></svg><span><b>Lance registrado.</b> Você é o maior lance no momento.</span></div>'
      +'<div class="kv"><span class="k">Lote</span><span class="v">#'+esc(res.lote)+'</span></div>'
      +'<div class="kv"><span class="k">Seu lance</span><span class="v mono">'+brl(res.lance_atual)+'</span></div>'
      +'<div class="kv"><span class="k">Horário</span><span class="v">'+esc(fmtDT(new Date().toISOString()))+'</span></div>'
      +'<div class="kv"><span class="k">Encerra em</span><span class="v">'+esc(fmtDT(res.encerra_em))+'</span></div>'
      +'<div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-line btn-block" id="bmKeep">Continuar vendo</button><a class="btn btn-primary btn-block" href="#/conta/lances">Meus lances</a></div>';
    $("bmKeep").onclick=close;
    toast("Lance de "+brl(res.lance_atual)+" registrado.","ok");
    await refreshCurrent();
  };
}
async function refreshCurrent(){
  if(S.route.name==="lote"&&S.curLot){await loadLot(S.curLot.numero);}
  await loadLots();
  if(S.session)await loadMine();
  render();
}

/* ===== realtime ===== */
var rtChan=null;
function subscribeRealtime(){
  try{
    if(rtChan)sb.removeChannel(rtChan);
    rtChan=sb.channel("rt-lots")
      .on("postgres_changes",{event:"*",schema:"public",table:"lots"},function(){scheduleRefresh();})
      .on("postgres_changes",{event:"*",schema:"public",table:"bids"},function(){scheduleRefresh();})
      .subscribe();
  }catch(e){}
}
var refreshT=null;
function scheduleRefresh(){clearTimeout(refreshT);refreshT=setTimeout(function(){refreshCurrent();},700);}

/* ===== countdown tick ===== */
setInterval(function(){
  document.querySelectorAll("[data-cd]").forEach(function(el){
    var lf=left(el.getAttribute("data-cd"));el.textContent=lf.txt;
    if(lf.urgent&&el.classList.contains("cd"))el.parentElement.classList.add("urgent");
  });
},1000);

/* ===== wire (eventos por render) ===== */
function wire(){
  var tb=$("themeBtn"),tb2=$("themeBtn2");
  function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("sbx_theme",t);}catch(e){}}
  function tog(){var c=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";setTheme(c);}
  if(tb)tb.onclick=tog; if(tb2)tb2.onclick=function(e){e.preventDefault();tog();};
  var bg=$("burger");if(bg)bg.onclick=function(){$("mSheet").hidden=false;};
  var ms=$("mSheet");if(ms){ms.addEventListener("click",function(e){if(e.target===ms||e.target.tagName==="A")ms.hidden=true;});}

  // home
  var q=$("q");if(q)q.oninput=function(){S.q=this.value;var lots=document.querySelector(".grid");/*debounce simple*/clearTimeout(window.__qT);window.__qT=setTimeout(function(){renderHomeGridOnly();},250);};
  document.querySelectorAll("[data-cat]").forEach(function(b){b.onclick=function(){S.cat=this.getAttribute("data-cat");render();var el=document.getElementById("catalogo");if(el)el.scrollIntoView();};});

  // lote bid
  var bidBtn=$("bidBtn");
  if(bidBtn){
    var l=S.curLot;
    var inp=$("bidv");
    function setv(c){inp.value=(c/100).toFixed(2).replace(".",",");}
    var dec=$("dec"),inc=$("inc");
    if(dec)dec.onclick=function(){var c=reaisToCents(inp.value)-l.incremento;if(c<minBid(l))c=minBid(l);setv(c);};
    if(inc)inc.onclick=function(){var c=reaisToCents(inp.value)+l.incremento;setv(c);};
    document.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){var k=this.getAttribute("data-q");if(k==="min")setv(minBid(l));else setv(minBid(l)+l.incremento*(parseInt(k)-0)- l.incremento + l.incremento*parseInt(k)*0 + l.incremento*(parseInt(k)-1));/*simpler below*/ if(k==="1")setv(minBid(l)+l.incremento*0+l.incremento*1-l.incremento); };});
    // simpler quick handlers (override)
    document.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){var k=this.getAttribute("data-q");if(k==="min")setv(minBid(l));else setv(minBid(l)+l.incremento*(parseInt(k)));};});
    bidBtn.onclick=function(){
      if(!S.session){toast("Entre na sua conta para dar um lance.");location.hash="#/entrar";return;}
      var c=reaisToCents(inp.value);
      if(c<minBid(l)){toast("Lance abaixo do mínimo ("+brl(minBid(l))+").","bad");setv(minBid(l));return;}
      openBidReview(l,c);
    };
  }

  // auth
  var af=$("authForm");
  if(af){af.onsubmit=async function(e){e.preventDefault();var btn=$("authBtn"),er=$("authErr");er.style.display="none";btn.disabled=true;btn.textContent="Aguarde…";
    var f=new FormData(af),email=f.get("email"),senha=f.get("senha");
    var cad=S.route.name==="cadastrar";
    try{
      if(cad){
        var r=await sb.auth.signUp({email:email,password:senha,options:{data:{nome:f.get("nome"),whatsapp:f.get("whatsapp"),cidade:f.get("cidade")}}});
        if(r.error)throw r.error;
        if(!r.data.session){er.textContent="Conta criada! Confirme o e-mail se solicitado e faça login.";er.style.display="block";btn.disabled=false;btn.textContent="Criar conta";location.hash="#/entrar";return;}
      } else {
        var r2=await sb.auth.signInWithPassword({email:email,password:senha});
        if(r2.error)throw r2.error;
      }
      await afterAuth();location.hash="#/";
    }catch(err){er.textContent=(err&&err.message&&/Invalid login/.test(err.message))?"E-mail ou senha inválidos.":(err.message||"Não foi possível concluir.");er.style.display="block";btn.disabled=false;btn.textContent=cad?"Criar conta":"Entrar";}
  };}

  // dados
  var df=$("dadosForm");
  if(df){df.onsubmit=async function(e){e.preventDefault();var f=new FormData(df);var btn=$("dadosBtn");btn.disabled=true;
    var r=await sb.from("profiles").update({nome:f.get("nome"),cidade:f.get("cidade"),whatsapp:f.get("whatsapp")}).eq("id",S.session.user.id);
    btn.disabled=false;if(r.error){toast("Erro ao salvar.","bad");}else{await loadProfile();toast("Dados salvos.","ok");render();}};}

  wireAdmin();
}
function renderHomeGridOnly(){ // re-render só a home para busca fluida
  if(S.route.name!=="home")return;
  var app=$("app");var main=app;
  // simplest: full render but keep focus
  var active=document.activeElement,val=active&&active.id==="q"?active.value:null,pos=active&&active.selectionStart;
  render();
  if(val!=null){var q=$("q");if(q){q.focus();q.value=val;try{q.setSelectionRange(pos,pos);}catch(e){}}}
}
function wireAdmin(){
  document.querySelectorAll("[data-adm]").forEach(function(b){b.onclick=function(){S.admTab=this.getAttribute("data-adm");render();};});
  document.querySelectorAll("[data-open]").forEach(function(b){b.onclick=async function(){await sb.from("lots").update({status:"aberto"}).eq("id",this.getAttribute("data-open"));await loadLots();toast("Lote aberto.","ok");render();};});
  document.querySelectorAll("[data-close]").forEach(function(b){b.onclick=async function(){await sb.from("lots").update({status:"encerrado"}).eq("id",this.getAttribute("data-close"));await sb.rpc("close_expired_lots");await loadLots();await loadMine();toast("Lote encerrado.","ok");render();};});
  document.querySelectorAll("[data-edit]").forEach(function(b){b.onclick=function(){var l=S.lots.filter(function(x){return x.id===this.getAttribute("data-edit");}.bind(this))[0];S.admTab="novo";render();var host=document.querySelector(".adm-tabs");if(host){var f=document.createElement("div");}
    // replace form with edit form
    var wrapEl=document.querySelector("#lotForm");if(wrapEl){wrapEl.outerHTML=lotForm(l);wireLotForm();}};});
  document.querySelectorAll("[data-pay]").forEach(function(b){b.onclick=async function(){await sb.from("arremates").update({status:"pago",atualizado_em:new Date().toISOString()}).eq("id",this.getAttribute("data-pay"));await loadMine();toast("Marcado como pago.","ok");render();};});
  document.querySelectorAll("[data-deliver]").forEach(function(b){b.onclick=async function(){await sb.from("arremates").update({status:"retirado",atualizado_em:new Date().toISOString()}).eq("id",this.getAttribute("data-deliver"));await loadMine();toast("Marcado como retirado.","ok");render();};});
  var ag=$("agForm");if(ag){ag.onsubmit=async function(e){e.preventDefault();var f=new FormData(ag);var r=await sb.from("agenda").insert({titulo:f.get("titulo"),categoria:f.get("categoria"),quando:new Date(f.get("quando")).toISOString(),qtd_lotes:f.get("qtd_lotes")?parseInt(f.get("qtd_lotes")):null});if(r.error){toast("Erro.","bad");}else{await loadAgenda();toast("Agenda atualizada.","ok");render();}};}
  var cf=$("cfgForm");if(cf){cf.onsubmit=async function(e){e.preventDefault();var f=new FormData(cf),obj={};f.forEach(function(v,k){obj[k]=v;});obj.atualizado_em=new Date().toISOString();var r=await sb.from("config").update(obj).eq("id",1);if(r.error){toast("Erro ao salvar.","bad");}else{await loadConfig();toast("Dados salvos.","ok");render();}};}
  wireLotForm();
}
function wireLotForm(){
  var lf=$("lotForm");if(!lf)return;
  var cancel=lf.querySelector("[data-cancel]");if(cancel)cancel.onclick=function(){S.admTab="lotes";render();};
  lf.onsubmit=async function(e){e.preventDefault();var f=new FormData(lf),id=lf.getAttribute("data-id");
    var fotos=(f.get("fotos")||"").split(",").map(function(s){return s.trim();}).filter(Boolean).map(function(u){return{url:u};});
    var obj={numero:parseInt(f.get("numero")),titulo:f.get("titulo"),categoria:f.get("categoria")||null,condicao:f.get("condicao")||null,qtd_estimada:f.get("qtd_estimada")||null,provavel_conteudo:f.get("provavel_conteudo")||null,descricao:f.get("descricao")||null,local_retirada:f.get("local_retirada")||null,fotos:fotos,lance_inicial:reaisToCents(f.get("lance_inicial")),incremento:reaisToCents(f.get("incremento")),abre_em:f.get("abre_em")?new Date(f.get("abre_em")).toISOString():null,encerra_em:f.get("encerra_em")?new Date(f.get("encerra_em")).toISOString():null,status:f.get("status")};
    var r=id?await sb.from("lots").update(obj).eq("id",id):await sb.from("lots").insert(obj);
    if(r.error){toast("Erro: "+(r.error.message||""),"bad");return;}
    await loadLots();S.admTab="lotes";toast(id?"Lote salvo.":"Lote criado.","ok");render();};
}

/* ===== auth lifecycle + router ===== */
async function afterAuth(){await loadProfile();await loadMine();subscribeRealtime();}
async function boot(){
  try{var st=localStorage.getItem("sbx_theme");if(st)document.documentElement.setAttribute("data-theme",st);}catch(e){}
  var s=await sb.auth.getSession();S.session=s.data.session||null;
  await loadConfig();await loadLots();await loadAgenda();
  if(S.session){await loadProfile();await loadMine();}
  subscribeRealtime();
  sb.auth.onAuthStateChange(function(_e,sess){S.session=sess||null;});
  route();
}
async function route(){
  var h=location.hash.replace(/^#/,"")||"/";
  var parts=h.split("/").filter(Boolean); // e.g. ['lote','104'] or ['conta','lances']
  var name=parts[0]||"home";
  if(h==="/"||h===""){name="home";}
  if(name==="lote"){S.route={name:"lote"};await loadLot(parseInt(parts[1]));}
  else if(name==="conta"){S.route={name:"conta"};S.acctTab=parts[1]||"visao";if(S.session){await loadMine();await loadProfile();}}
  else if(name==="admin"){S.route={name:"admin"};if(isAdmin()){await loadLots();await loadMine();await loadAgenda();}}
  else if(name==="sair"){await sb.auth.signOut();S.session=null;S.profile=null;S.myBids=[];S.arremates=[];toast("Você saiu da conta.");location.hash="#/";return;}
  else if(["como","agenda","ajuda","entrar","cadastrar"].indexOf(name)>=0){S.route={name:name};if(name==="agenda")await loadAgenda();}
  else {S.route={name:"home"};}
  render();window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
boot();
</script>
